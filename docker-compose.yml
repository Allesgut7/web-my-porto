services:
  postgres:
    image: postgres:16-alpine
    container_name: web_my_porto_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: web-my-porto
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - web_my_porto_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: web_my_porto_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - web_my_porto_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: web_my_porto_frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - web_my_porto_network

volumes:
  postgres_data:

networks:
  web_my_porto_network:
    driver: bridge